<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body>
    <div id="cursor-light"></div>
    <div class="nf-wrap page">
      <div class="nf-card">
        <h1><i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>Page Not Found</h1>
        <p class="mb-3">The requested page was not found.</p>
        <a class="toggle-btn d-inline-flex align-items-center" href="/" aria-label="Go back home">
          <span>Back to home</span>
          <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
        </a>
      </div>
    </div>
    <script>
      const cursorLight = document.getElementById("cursor-light");
      document.addEventListener("mousemove", (e) => {
        cursorLight.style.top = `${e.clientY}px`;
        cursorLight.style.left = `${e.clientX}px`;
      });
    </script>
  </body>
</html>
